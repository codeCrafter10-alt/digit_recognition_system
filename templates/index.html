<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digit Recognizer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Sans-serif', monospace;
            background: #00121a;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 2.6rem;
            font-weight: normal;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #cecece;
            margin-bottom: 2rem;
            margin-top: 2rem;
            text-align: center;
        }

        #canvas {
            display: block;
            background: #111;
            border: 1px solid #333;
            cursor: crosshair;
            max-width: 90%;
            height: auto;
            touch-action: none;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        button {
            font-family: 'Courier New', monospace;
            font-size: 1.6rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            padding: 0.6rem 1.5rem;
            background: transparent;
            color: #e0e0e0;
            border: 1px solid #444;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
            margin-top: 2rem;
            margin-bottom: 0rem;
            margin-left: 1rem;
            margin-right: 1rem;
            touch-action: manipulation;
        }

        button:hover { border-color: #e0e0e0; }

        #predict-btn {
            border-color: #e0e0e0;
        }

        #predict-btn:hover {
            background: #e0e0e0;
            color: #0a0a0a;
        }

        #results {
            display: flex;
            gap: 3rem;
            margin-top: 1rem;
            text-align: center;
        }

        .model {
            min-width: 150px;
        }

        .model h2 {
            font-size: 1rem;
            font-weight: normal;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 0.5rem;
        }

        .prediction {
            font-size: 4.2rem;
            font-weight: bold;
            color: #fff;
            min-height: 5rem;
            letter-spacing: -0.02em;
        }

        .prediction.loading {
            font-size: 1.5rem;
            color: #555;
            letter-spacing: 0.1em;
            padding-top: 1.5rem;
        }
    </style>
</head>

<body>
    <h1>Digit Recognizer</h1>

    <canvas id="canvas" width="392" height="392"></canvas>

    <div class="controls">
        <button id="clear-btn">Clear</button>
        <button id="predict-btn">Predict</button>
    </div>

    <div id="results">
        <div class="model">
            <h2 style="font-size: 1.6rem; margin-right: 0.7rem; margin-top: 0.8rem;">Neural Network</h2>
            <div id="nn-result" class="prediction">—</div>
        </div>

        <div class="model">
            <h2 style="font-size: 1.6rem; margin-left: 0.7rem; margin-top: 0.8rem;">CNN</h2>
            <div id="cnn-result" class="prediction">—</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        const nnResult = document.getElementById("nn-result");
        const cnnResult = document.getElementById("cnn-result");

        // Drawing state
        let isDrawing = false;

        // Set drawing style
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 16;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        // Mouse events
        canvas.addEventListener("mousedown", (e) => {
            isDrawing = true;
            ctx.beginPath();
            ctx.moveTo(e.offsetX, e.offsetY);
        });

        canvas.addEventListener("mousemove", (e) => {
            if (!isDrawing) return;
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.stroke();
        });

        canvas.addEventListener("mouseup", () => { isDrawing = false; });
        canvas.addEventListener("mouseleave", () => { isDrawing = false; });

        // Touch events
        canvas.addEventListener("touchstart", (e) => {
            e.preventDefault();
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            const x = e.touches[0].clientX - rect.left;
            const y = e.touches[0].clientY - rect.top;
            ctx.beginPath();
            ctx.moveTo(x, y);
        });

        canvas.addEventListener("touchmove", (e) => {
            e.preventDefault();
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.touches[0].clientX - rect.left;
            const y = e.touches[0].clientY - rect.top;
            ctx.lineTo(x, y);
            ctx.stroke();
        });

        canvas.addEventListener("touchend", () => { isDrawing = false; });
        canvas.addEventListener("touchcancel", () => { isDrawing = false; });

        // Clear canvas
        document.getElementById("clear-btn").addEventListener("click", () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            nnResult.textContent = "—";
            cnnResult.textContent = "—";
            nnResult.className = "prediction";
            cnnResult.className = "prediction";
        });

        // Predict
        document.getElementById("predict-btn").addEventListener("click", async () => {
            nnResult.textContent = "thinking...";
            cnnResult.textContent = "thinking...";

            nnResult.className = "prediction loading";
            cnnResult.className = "prediction loading";

            const imageData = canvas.toDataURL("image/png");

            try {
                const [nnResponse, cnnResponse] = await Promise.all([
                    fetch("/predict_nn", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ image: imageData })
                    }),

                    fetch("/predict_cnn", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ image: imageData })
                    })
                ]);

                const nnData = await nnResponse.json();
                const cnnData = await cnnResponse.json();

                nnResult.textContent = nnData.prediction ?? "Error";
                cnnResult.textContent = cnnData.prediction ?? "Error";

                nnResult.className = "prediction";
                cnnResult.className = "prediction";

            } catch (error) {
                console.error(error);

                nnResult.textContent = "Error";
                cnnResult.textContent = "Error";

                nnResult.className = "prediction";
                cnnResult.className = "prediction";
            }
        });
    </script>
</body>
